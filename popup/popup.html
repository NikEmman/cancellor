<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #1f2937;
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 550px;
      }

      .p-4 {
        padding: 16px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: #9ca3af;
        margin-bottom: 8px;
      }

      .w-full {
        width: 100%;
      }

      .p-3 {
        padding: 12px;
      }

      .border {
        border: 1px solid;
      }

      .border-gray-300 {
        border-color: #d1d5db;
      }

      .rounded-lg {
        border-radius: 8px;
      }

      .font-mono {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .text-sm {
        font-size: 14px;
      }

      textarea {
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 2px #6366f1;
      }

      .mt-3 {
        margin-top: 12px;
      }

      .font-medium {
        font-weight: 500;
      }

      .mt-4 {
        margin-top: 16px;
      }

      .px-6 {
        padding-left: 24px;
        padding-right: 24px;
      }

      .py-3 {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .bg-green-500 {
        background-color: #22c55e;
      }

      .text-white {
        color: #ffffff;
      }

      .text-lg {
        font-size: 18px;
      }

      .font-semibold {
        font-weight: 600;
      }

      .transition {
        transition: background-color 150ms;
      }

      button:disabled {
        background-color: #9ca3af;
        cursor: not-allowed;
      }

      button:hover:not(:disabled) {
        background-color: #14532d;
      }

      .text-green-600 {
        color: #16a34a;
      }

      .text-red-600 {
        color: #dc2626;
      }

      .text-yellow-600 {
        color: #ca8a04;
      }

      #parse-status {
        transition: opacity 0.6s ease;
      }

      /* Queue section */
      .queue-box {
        background-color: #111827;
        border: 1px solid #374151;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }

      .queue-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .queue-list {
        max-height: 72px;
        overflow-y: auto;
        margin-top: 8px;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        color: #6b7280;
        line-height: 1.6;
      }

      #clear-queue-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 13px;
        color: #dc2626;
        padding: 0;
        font-weight: 500;
      }

      #clear-queue-btn:hover {
        background: none;
        color: #991b1b;
      }

      #clear-queue-btn:disabled {
        background: none;
        color: #9ca3af;
        cursor: not-allowed;
      }

      .btn-add {
        background-color: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 0;
        width: 100%;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 150ms;
        margin-top: 10px;
      }

      .btn-add:hover:not(:disabled) {
        background-color: #3730a3;
      }

      .btn-add:disabled {
        background-color: #9ca3af;
        cursor: not-allowed;
      }

      /* Α130 section */
      .a130-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        cursor: pointer;
        user-select: none;
      }

      .a130-toggle input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: #4f46e5;
        cursor: pointer;
        flex-shrink: 0;
      }

      .a130-toggle span {
        font-size: 14px;
        font-weight: 600;
        color: #c4b5fd;
      }

      .a130-fields {
        display: none;
        background-color: #111827;
        border: 1px solid #4f46e5;
        border-radius: 8px;
        padding: 14px;
        margin-top: 8px;
        gap: 12px;
        flex-direction: column;
      }

      .a130-fields.visible {
        display: flex;
      }

      .a130-fields label {
        margin-bottom: 4px;
        color: #a5b4fc;
        font-size: 13px;
      }

      .a130-fields input[type="text"] {
        width: 100%;
        background-color: #1f2937;
        border: 1px solid #374151;
        border-radius: 6px;
        padding: 8px 10px;
        color: #f9fafb;
        font-size: 14px;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .a130-fields input[type="text"]:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 2px #6366f140;
      }
      #a130-depts {
        width: 100%;
      }

      .a130-warn {
        font-size: 12px;
        color: #fbbf24;
        margin-top: 4px;
        display: none;
      }
    </style>

    <script src="jszip.min.js"></script>
    <script src="popup.js" defer></script>
  </head>

  <body class="bg-gray-800 p-10 flex flex-col gap-2">
    <div class="p-4">
      <!-- Persistent queue display -->
      <div class="queue-box">
        <div class="queue-header">
          <span
            id="queue-count"
            class="text-sm font-medium"
            style="color: #9ca3af"
          >
            Ουρά: κενή
          </span>
          <button id="clear-queue-btn" disabled>Εκκαθάριση</button>
        </div>
        <div id="queue-list" class="queue-list"></div>
      </div>

      <label class="block text-sm font-medium text-gray-400 mb-2">
        Επικόλλησε ΑΔΤ Νέων Ταυτοτήτων για προσθήκη στην ουρά (ένα ανά γραμμή):
      </label>
      <textarea
        id="csv-input"
        rows="8"
        class="w-full p-3 border border-gray-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-vertical"
        placeholder="Α03333605
ΑΒ123456
ΓΔ987654"
      ></textarea>

      <div id="parse-status" class="mt-3 text-sm font-medium"></div>

      <button id="add-to-queue" disabled class="btn-add">
        Προσθήκη στην ουρά
      </button>

      <label class="a130-toggle">
        <input type="checkbox" id="other-dept-check" checked />
        <span
          >Θα καταχωρήσω και Δελτία όπου τα παλιά δεν είναι της Υπηρεσίας
          μου</span
        >
      </label>

      <div class="a130-fields visible" id="other-dept-fields">
        <div>
          <label for="a130-depts">Τμήματα (ένα ανά γραμμή)</label>
          <textarea id="a130-depts" rows="4" class="font-mono text-sm">
Τ.Δ.Ε.Ε. ΚΟΜΟΤΗΝΗΣ
Τ.Α. ΚΟΜΟΤΗΝΗΣ
Α.Τ. ΠΕΡΙΦ. ΚΟΜΟΤΗΝΗΣ
Τ.Α. ΚΟΜΟΤΗΝΗΣ ΡΟΔΟΠΗΣ</textarea
          >
        </div>

        <label class="a130-toggle" style="margin-top: 4px">
          <input type="checkbox" id="a130-check" checked />
          <span>Θέλω να παραχθεί Α130</span>
        </label>

        <div class="a130-fields visible" id="a130-fields">
          <div>
            <label for="a130-amy">Α.Μ.Υ.</label>
            <input type="text" id="a130-amy" maxlength="10" value="4587" />
            <div class="a130-warn" id="a130-amy-warn">
              Είσαι σίγουρος ότι είναι σωστό;
            </div>
          </div>
          <div>
            <label for="a130-bathmos">Βαθμός</label>
            <input type="text" id="a130-bathmos" value="Αρχ/κας" />
          </div>
        </div>
      </div>

      <button
        id="start"
        disabled
        class="mt-4 w-full px-6 py-3 bg-green-500 text-white text-lg font-semibold rounded-lg disabled:bg-gray-400 disabled:cursor-not-allowed hover:bg-green-900 transition"
      >
        Έναρξη
      </button>
    </div>
  </body>
</html>
