<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #1f2937;
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 550px;
      }

      .p-4 {
        padding: 16px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: #9ca3af;
        margin-bottom: 8px;
      }

      .w-full {
        width: 100%;
      }

      .p-3 {
        padding: 12px;
      }

      .border {
        border: 1px solid;
      }

      .border-gray-300 {
        border-color: #d1d5db;
      }

      .rounded-lg {
        border-radius: 8px;
      }

      .font-mono {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .text-sm {
        font-size: 14px;
      }

      textarea {
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 2px #6366f1;
      }

      .mt-3 {
        margin-top: 12px;
      }

      .font-medium {
        font-weight: 500;
      }

      .mt-4 {
        margin-top: 16px;
      }

      .px-6 {
        padding-left: 24px;
        padding-right: 24px;
      }

      .py-3 {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .bg-green-500 {
        background-color: #22c55e;
      }

      .text-white {
        color: #ffffff;
      }

      .text-lg {
        font-size: 18px;
      }

      .font-semibold {
        font-weight: 600;
      }

      .transition {
        transition: background-color 150ms;
      }

      button:disabled {
        background-color: #9ca3af;
        cursor: not-allowed;
      }

      button:hover:not(:disabled) {
        background-color: #14532d;
      }

      .text-green-600 {
        color: #16a34a;
      }

      .text-red-600 {
        color: #dc2626;
      }

      .text-yellow-600 {
        color: #ca8a04;
      }
    </style>

    <script src="popup.js" defer></script>
  </head>

  <body class="bg-gray-800 p-10 flex flex-col gap-2">
    <div class="p-4">
      <label class="block text-sm font-medium text-gray-400 mb-2">
        Επικόλλησε τα ΑΔΤ Νέων Ταυτοτήτων (ένα ανά γραμμή):
      </label>
      <textarea
        id="csv-input"
        rows="12"
        class="w-full p-3 border border-gray-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-vertical"
        placeholder="Α03333605
ΑΒ123456
ΓΔ987654"
      ></textarea>

      <div id="parse-status" class="mt-3 text-sm font-medium"></div>

      <button
        id="start"
        disabled
        class="mt-4 w-full px-6 py-3 bg-green-500 text-white text-lg font-semibold rounded-lg disabled:bg-gray-400 disabled:cursor-not-allowed hover:bg-green-900 transition"
      >
        Έναρξη
      </button>
    </div>
  </body>
</html>
